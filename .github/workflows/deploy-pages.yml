name: Deploy to GitHub Pages

# Build trang tĩnh rồi đẩy lên GitHub Pages.
# Backend KHÔNG nằm trong repo này — nó chạy trên máy và ra Internet qua Cloudflare Tunnel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Kiểm tra cấu hình TRƯỚC khi cài gói — sai thì biết sau 5 giây,
      # thay vì chờ hết 2 phút build rồi mới báo.
      - name: Kiểm tra biến cấu hình
        id: cfg
        env:
          # Đọc tab Variables trước, không có thì thử tab Secrets.
          # (Hai giá trị này không phải bí mật — để ở Variables mới đúng chỗ.)
          RAW_API: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL }}
          RAW_SITE: ${{ vars.PUBLIC_SITE_URL || secrets.PUBLIC_SITE_URL }}
        run: |
          # Cắt dấu / thừa ở cuối — dán từ thanh địa chỉ hay bị dính
          api="${RAW_API%/}"
          site="${RAW_SITE%/}"
          fail=0

          if [ -z "$api" ]; then
            echo "::error::Chưa đặt PUBLIC_API_URL"
            fail=1
          elif echo "$api" | grep -q "localhost\|127\.0\.0\.1"; then
            echo "::error::PUBLIC_API_URL trỏ về máy cục bộ nên người dùng sẽ không gọi được: $api"
            fail=1
          elif ! echo "$api" | grep -q "^https://"; then
            echo "::error::PUBLIC_API_URL phải bắt đầu bằng https:// — đang là: $api"
            fail=1
          elif ! echo "$api" | grep -q "/api/v1$"; then
            echo "::error::PUBLIC_API_URL phải kết thúc bằng /api/v1 — đang là: $api"
            fail=1
          fi

          if [ -z "$site" ]; then
            echo "::error::Chưa đặt PUBLIC_SITE_URL"
            fail=1
          elif ! echo "$site" | grep -q "^https://"; then
            echo "::error::PUBLIC_SITE_URL phải bắt đầu bằng https:// — đang là: $site"
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            {
              echo "### Thiếu cấu hình deploy"
              echo ""
              echo "Vào **Settings → Secrets and variables → Actions → tab Variables**"
              echo "(tab **Variables**, không phải tab Secrets) → **New repository variable**:"
              echo ""
              echo "| Tên | Giá trị |"
              echo "|-----|---------|"
              echo '| `PUBLIC_API_URL` | `https://api.tenmien.com/api/v1` |'
              echo '| `PUBLIC_SITE_URL` | `https://tenmien.com` |'
              echo ""
              echo "Đặt xong vào tab **Actions** → chọn workflow này → **Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "api=$api"   >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_API_URL  = $api"
          echo "PUBLIC_SITE_URL = $site"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt gói
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu
        run: npm run check

      - name: Build trang tĩnh
        env:
          PUBLIC_API_URL: ${{ steps.cfg.outputs.api }}
          PUBLIC_SITE_URL: ${{ steps.cfg.outputs.site }}
        run: npm run build

      - name: Kiểm tra kết quả build
        run: |
          npm run test:pages
          test -f dist/.nojekyll || (echo "::error::Thiếu .nojekyll — GitHub sẽ bỏ qua _astro/" && exit 1)
          {
            echo "### Đã build xong"
            echo ""
            echo "- Số trang: **$(find dist -name '*.html' | wc -l)**"
            echo "- Tên miền: \`$(cat dist/CNAME 2>/dev/null || echo '(không đặt)')\`"
            echo "- API: \`${{ steps.cfg.outputs.api }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # BẮT BUỘC: từ v5 action tự loại file ẩn khỏi gói.
          # Không bật thì .nojekyll bị bỏ, GitHub bỏ qua _astro/, trang ra trắng.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
